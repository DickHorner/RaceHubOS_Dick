name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          for file in packages/backend/src/__tests__/raceControl.test.js packages/backend/src/routes/raceControl.js packages/backend/src/services/SessionService.js packages/frontend/src/components/SessionForm.jsx packages/frontend/src/components/championship/SessionSection.jsx packages/frontend/src/pages/DriverDisplay.jsx packages/frontend/src/pages/MobileRaceControl.jsx; do
            ./node_modules/.bin/prettier "$file" | diff -u "$file" - || true
          done
      - run: npm run check -- --ci
      - run: npm run build
      - run: npm run prisma:generate -w @racehubos/backend
      - run: npm test -w @racehubos/backend
