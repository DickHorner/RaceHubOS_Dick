name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          ./node_modules/.bin/prettier --write packages/backend/src/__tests__/ghostConfigSlots.test.js
          echo FORMATTED_START:packages/backend/src/__tests__/ghostConfigSlots.test.js
          base64 -w0 packages/backend/src/__tests__/ghostConfigSlots.test.js
          echo
          echo FORMATTED_END
      - run: npm run check -- --ci
      - run: npm run build
      - run: npm run prisma:generate -w @racehubos/backend
      - run: npm test -w @racehubos/backend
