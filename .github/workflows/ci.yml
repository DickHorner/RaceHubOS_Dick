name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check -- --ci
      - run: node --test packages/frontend/tests/lapAnalysis.unit.js
      - run: npm run build
      - run: npm run prisma:generate -w @racehubos/backend
      - run: npm test -w @racehubos/backend
      - run: npx playwright install --with-deps chromium
        working-directory: packages/frontend
      - run: npx playwright test tests/raceCommentary.spec.js
        working-directory: packages/frontend
