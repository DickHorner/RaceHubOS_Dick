name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: ./node_modules/.bin/prettier scripts/check-rules.mjs | diff -u scripts/check-rules.mjs - || true
      - run: npm run check -- --ci
      - run: npm run build
      - run: npm run prisma:generate -w @racehubos/backend
      - run: npm test -w @racehubos/backend
