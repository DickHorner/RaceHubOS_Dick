name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          for f in packages/frontend/src/pages/FreeSessionPage.jsx packages/frontend/tests/freeWidgetLayout.spec.js; do
            ./node_modules/.bin/prettier --write "$f"
            echo "FORMATTED_START:$f"
            base64 -w0 "$f"
            echo
            echo "FORMATTED_END:$f"
          done
      - run: npm run check -- --ci
      - run: node --test packages/frontend/tests/lapAnalysis.unit.js
      - run: npm run build
      - run: npm run prisma:generate -w @racehubos/backend
      - run: npx playwright install chromium
        working-directory: packages/frontend
      - run: npm test -- tests/freeWidgetLayout.spec.js
        working-directory: packages/frontend
      - run: npm test -w @racehubos/backend
